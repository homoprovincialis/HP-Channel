name: Validate HP Channel website

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install image validator
        run: python3 -m pip install Pillow
      - name: Verify HTML links, local photos and JPEG decoding
        run: python3 Data/Assets/check_site.py
