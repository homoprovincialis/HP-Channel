name: Assign unique local article photographs

# Historical one-time importer. Disabled to prevent accidental image rewrites.
# For new images, prepare a separate reviewed PR and run check_site.py.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  assign-photos:
    if: ${{ false }} # retired: do not write images from an old snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install Pillow for real JPEG decoding
        run: python3 -m pip install Pillow
      - name: Download, verify, assign and save unique images
        run: python3 Data/Assets/assign_unique_article_images.py
      - name: Commit only complete and verified images and HTML changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.html' 'Data/Images/Images for Video'
          if ! git diff --cached --quiet; then
            git commit -m "Save and assign 31 unique verified local article photographs"
            git push
          fi
      - name: Show verification
        run: cat 'Data/Images/Images for Video/verification.txt'
